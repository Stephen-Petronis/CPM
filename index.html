<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chris the Project Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one arcade cabinet column. Marquee on top, CRT screen in a black bezel, control deck below. Single dark look by design. */
:root{
  --bg:#0b0a12;
  --cab:#191526;
  --bezel:#05040a;
  --marquee:#ffd23f;
  --hot:#e8433a;
  --ink:#f3efe6;
  --dim:#8f89a8;
  --btn:#2a2440;
  --display:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  --body:ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{padding-block:16px;padding-inline:16px;font-family:var(--body)}
.cab{max-width:820px;margin:0 auto;display:flex;flex-direction:column}
.marquee{background:var(--marquee);color:var(--bezel);font-family:var(--display);text-align:center;padding:14px 12px 12px;border-radius:10px 10px 0 0;box-shadow:inset 0 -5px 0 var(--hot);font-size:clamp(13px,3.6vw,24px);letter-spacing:.06em;line-height:1.4;text-wrap:balance}
.marquee small{display:block;font-size:.42em;letter-spacing:.24em;margin-top:6px}
.screen-wrap{background:var(--bezel);padding:clamp(8px,2.4vw,22px);position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:256/240;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:4px;touch-action:none}
.scan{pointer-events:none;position:absolute;inset:clamp(8px,2.4vw,22px);border-radius:4px;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.2) 2px 3px)}
.deck{background:var(--cab);border-radius:0 0 10px 10px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,50px);gap:6px}
.mid{display:flex;flex-direction:column;gap:8px;align-items:center}
.ab{display:flex;gap:14px;align-items:center}
button{font-family:var(--display);color:var(--ink);background:var(--btn);border:0;border-radius:8px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 0 var(--bezel)}
button:active,button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--bezel)}
button:focus-visible{outline:3px solid var(--marquee);outline-offset:2px}
.pad button{font-size:14px}
.pill{font-size:9px;padding:10px 14px;letter-spacing:.08em;min-width:110px}
.round{width:66px;height:66px;border-radius:50%;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.round small{font-size:7px;letter-spacing:.08em}
.round.a{background:var(--hot)}
.round.b{background:var(--marquee);color:var(--bezel)}
.keys{color:var(--dim);font-size:12px;line-height:1.7;text-align:center;max-width:65ch;margin:14px auto 0;text-wrap:balance}
.keys b{color:var(--ink);font-weight:600}
@media (max-width:520px){.mid{order:3;flex-basis:100%;flex-direction:row;justify-content:center}.deck{padding:14px 12px}.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,46px);gap:5px}.round{width:58px;height:58px}.ab{gap:10px}}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){.keys{display:none}}
/* phone held sideways: controls flank the screen, screen fills the height */
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:8px}
  .marquee,.keys{display:none}
  .cab{max-width:none;display:grid;grid-template-columns:auto auto auto;grid-template-areas:"pad screen ab" "mid screen ab";justify-content:center;align-items:center;gap:10px 16px}
  .deck{display:contents}
  .pad{grid-area:pad;align-self:end}
  .mid{grid-area:mid;align-self:start;order:0;flex-basis:auto;flex-direction:column}
  .ab{grid-area:ab}
  .screen-wrap{grid-area:screen;padding:6px;border-radius:8px;width:calc((100vh - 44px)*256/240);width:calc((100dvh - 44px)*256/240);max-width:calc(100vw - 420px);min-width:200px}
  .scan{inset:6px}
}
@media (prefers-reduced-motion:reduce){button:active,button.on{transform:none}}
</style>

<div class="cab">
  <div class="marquee">CHRIS THE PROJECT MANAGER<small>WORKING TITLE · 1 PLAYER</small></div>
  <div class="screen-wrap">
    <canvas id="screen" width="256" height="240" aria-label="Game screen"></canvas>
    <div class="scan"></div>
  </div>
  <div class="deck">
    <div class="pad" aria-label="Direction pad">
      <span></span><button data-k="up" aria-label="Up">▲</button><span></span>
      <button data-k="left" aria-label="Left">◀</button><button data-k="down" aria-label="Down">▼</button><button data-k="right" aria-label="Right">▶</button>
    </div>
    <div class="mid">
      <button class="pill" data-k="start">START</button>
      <button class="pill" id="mute" type="button">SOUND ON</button>
    </div>
    <div class="ab">
      <button class="round b" data-k="b">B<small>KICK</small></button>
      <button class="round a" data-k="a">A<small>JUMP</small></button>
    </div>
  </div>
  <p class="keys">Keyboard: <b>Arrows/WASD</b> move · <b>Space</b> or <b>Z</b> = A (jump, start) · <b>X</b> = B (kick) · <b>Enter</b> = start · <b>P</b> = pause</p>
</div>

function toneAt(t,f,d=.08,type='square',vol=.05,slide=0,bus){

    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(bus||sfxBus);o.start(t);o.stop(t+d+.03);}catch(e){}
}

  if(!ac)return;

}

function setMusic(name){if(MUS.track===name)return;MUS.track=name;MUS.step=0;MUS.shift=0;MUS.speed=1;MUS.next=0;}
function musicTick(){
  if(!ac||!MUS.track||G.musicOff||ac.state!=='running')return;
  const tr=TRACKS[MUS.track],spb=60/(tr.bpm*MUS.speed)/2,now=ac.currentTime;
  if(MUS.next<now)MUS.next=now+.03;
  while(MUS.next<now+.12){
    const t=MUS.next,i=MUS.step%tr.lead.length,l=tr.lead[i],b=tr.bass[i];
    if(l)toneAt(t,NOTE(l+MUS.shift),spb*.9,'square',.028,0,musBus);
    if(b)toneAt(t,NOTE(b+MUS.shift),spb*.95,'triangle',.09,0,musBus);
    if(tr.drums){
      if(i%4===0)toneAt(t,150,.12,'sine',.18,-110,musBus);
      if(tr.drums===1&&i%8===4)noiseAt(t,.1,.07,1800,'bandpass',musBus);
      if(i%2===1)noiseAt(t,.03,.025,7000,'highpass',musBus);
    }
    MUS.next+=spb;MUS.step++;
  }
}

  hot(){

  },
  mkP(x,y,f,cpu){return{x,y,w:16,h:24,vx:0,vy:0,f,cpu,gr:false,stun:0,kcd:0,kick:0,anim:0,think:0,lazy:false,aim:0};},
  move(b,S){

    b.x+=b.vx;for(const s of S)if(ov(b,s)){if(b.vx>0)b.x=s.x-b.w;else b.x=s.x+s.w;b.hx=b.vx>0?1:-1;}

  flip(){

  moveBrief(){

    const spots=this.gd>0?[[108,116],[108,180],[28,184],[188,184]]:[[108,52],[108,116],[28,48],[188,48]];
    const opts=spots.filter(([x,y])=>!(x===this.brief.x&&y===this.brief.y)).map(([x,y])=>({x,y,w:40,h:16,pow:1})).filter(b=>!ov(b,this.p1)&&!ov(b,this.p2)&&!this.balls.some(q=>ov(b,q)));

  ai(p){

    if(p.gr&&(bcx-pcx)*d<0&&Math.abs(pcx-bcx)<26&&Math.abs(pcy-bcy)<20)J=1;
    if(Math.abs(bcx-pcx)<22&&Math.abs(bcy-pcy)<22&&p.kcd===0&&Math.random()<.06+.03*Math.min(G.level,5)){

  },
  updP(p,o){

    if(p.stun>0)p.stun--;

    else[L,R,J,K,aim]=this.ai(p);

  spawnBall(){const gd=this.gd;this.balls.push({x:122,y:gd>0?26:210,w:12,h:12,vx:(Math.random()<.5?-1:1)*rnd(1,2.2),vy:0,spin:0,rot:0,idle:0});this.left--;SFX.spawn();},
  updBall(b){
    const gd=this.gd,k=.025;
    b.vx+=-k*b.spin*b.vy*gd;b.vy+=k*b.spin*b.vx*gd;

    {const s=this.brief,ready=this.cd===0;if(s.pop)s.pop--;
      if(s.pop){ctx.fillStyle='#ffd23f';for(let i=0;i<8;i++){const a=i/8*6.283,r=26-s.pop;ctx.fillRect(s.x+20+Math.cos(a)*r,s.y+8+Math.sin(a)*r,2,2);}}

    for(const u of this.bumpers){ctx.fillStyle=u.hit?'#ffffff':'#ff7eb6';ctx.beginPath();ctx.arc(u.x,u.y,8,0,7);ctx.fill();ctx.fillStyle='#0d0b14';ctx.beginPath();ctx.arc(u.x,u.y,3,0,7);ctx.fill();}

/* ---------- round 3: pudding run ---------- */
const KMAP=["################","#D....#....#...#","#.##..#.##.#.#.#","#.#.......#..#.#","#.#.##.##.#.##.#","#......#.......#","##.###.#.###.#.#","#....#...#...#.#","#.##.#.#.#.###.#","#..#...#.....#.#","##.#.#####.#.#.#","#....#.....#...#","#.##...###...#B#","################"];
const ASKS=['GOT A SEC?','QUICK Q!','CAN YOU REVIEW?','HOP ON A CALL?','PER MY EMAIL...','JUST CHECKING IN'];
const CO_PALS=[{B:'#5bc248',H:'#e8d06a'},{B:'#9b59d0',H:'#2a1a10'},{B:'#f08a24',H:'#b0b0b0'},{B:'#3fb1a0',H:'#7a3b1c'}];
const Kitchen={
  init(){
    this.map=KMAP.map(r=>r.split(''));
    this.map.forEach((row,r)=>row.forEach((ch,c)=>{if(ch==='D')this.D={c,r};if(ch==='B')this.B={c,r};}));
    this.p={x:this.D.c*16+8,y:this.D.r*16+8,dir:[0,0],want:[0,0],freeze:0,rush:0,anim:0,face:1};
    this.need=Math.min(3+G.level,8);this.got=0;this.time=90*60;this.won=0;this.puds=[];
    for(let i=0;i<this.need;i++)this.placePud(6);
    this.cos=[];const n=Math.min(1+G.level,4);
    for(let i=0;i<n;i++)this.cos.push({x:this.B.c*16+8,y:this.B.r*16+8,dir:[0,0],rel:60+i*150,home:0,pal:CO_PALS[i]});
    if(G.level>=4)this.cos.push({x:this.B.c*16+8,y:this.B.r*16+8,dir:[0,0],rel:420,home:0,pal:CO_PALS[0],stapler:true});
  },
  walk(c,r){return r>=0&&r<14&&c>=0&&c<16&&this.map[r][c]!=='#';},
  placePud(minD){
    const pc=Math.round((this.p.x-8)/16),pr=Math.round((this.p.y-8)/16);
    for(let tries=0;tries<300;tries++){const c=1+(Math.random()*14|0),r=1+(Math.random()*12|0);
      if(!this.walk(c,r)||(c===this.D.c&&r===this.D.r)||(c===this.B.c&&r===this.B.r))continue;
      if(Math.abs(c-pc)+Math.abs(r-pr)<minD)continue;
      if(this.puds.some(q=>q.c===c&&q.r===r))continue;
      this.puds.push({c,r,b:Math.random()*6});return;}
  },
  center(o){return(o.x-8)%16===0&&(o.y-8)%16===0;},
  steer(co){
    const c=(co.x-8)/16,r=(co.y-8)/16,dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    let opts=dirs.filter(d=>this.walk(c+d[0],r+d[1])&&!(d[0]===-co.dir[0]&&d[1]===-co.dir[1]));
    if(!opts.length)opts=dirs.filter(d=>this.walk(c+d[0],r+d[1]));
    const dist=d=>Math.hypot(co.x+d[0]*16-this.p.x,co.y+d[1]*16-this.p.y);
    const chase=co.stapler?.95:Math.min(.35+.1*G.level,.8);
    if(this.p.rush>0)opts.sort((a,b)=>dist(b)-dist(a));
    else if(Math.random()<chase)opts.sort((a,b)=>dist(a)-dist(b));
    else opts=[pick(opts)];
    co.dir=opts[0]||[0,0];
  },
  sendHome(co,wait){co.x=this.B.c*16+8;co.y=this.B.r*16+8;co.dir=[0,0];co.home=wait;},
  update(){
    const p=this.p;
    if(this.won){this.won++;if(this.won>120){go(Banner,['SHIFT DONE!','','PUDDINGS SECURED','TIME BONUS +'+this.bonus,'','NOW DRIVE HOME. FAST.','FASTER. OVERTIME IS','RIGHT BEHIND YOU.','','UP = GAS  DOWN = BRAKE','ARROWS = BOOST','COFFEE = NITRO'],()=>go(DriveHome),320);}return;}
    if(--this.time<=0)return loseLife(()=>go(Kitchen));
    if(keys.left)p.want=[-1,0];else if(keys.right)p.want=[1,0];else if(keys.up)p.want=[0,-1];else if(keys.down)p.want=[0,1];
    if(p.rush>0)p.rush--;
    if(p.freeze>0)p.freeze--;
    else{
      for(let s=0;s<2;s++){
        if(this.center(p)){const c=(p.x-8)/16,r=(p.y-8)/16;
          if(this.walk(c+p.want[0],r+p.want[1]))p.dir=p.want.slice();
          if(!this.walk(c+p.dir[0],r+p.dir[1]))p.dir=[0,0];}
        else if(p.want[0]===-p.dir[0]&&p.want[1]===-p.dir[1])p.dir=p.want.slice();
        p.x+=p.dir[0];p.y+=p.dir[1];
      }
      if(p.dir[0])p.face=p.dir[0];
      if(p.dir[0]||p.dir[1])p.anim++;
    }
    // puddings
    for(const q of this.puds){if(Math.abs(q.c*16+8-p.x)<9&&Math.abs(q.r*16+8-p.y)<9){q.dead=1;this.got++;p.rush=240;addScore(100);SFX.rush();if(G.level>=2)G.trip=Math.max(G.trip,G.level>=4?200:120);pop(p.x,p.y+4,this.got>=this.need?'ALL SET! TO DESK!':'SUGAR RUSH!','#f6e7a1');}}
    this.puds=this.puds.filter(q=>!q.dead);
    // coworkers
    for(const co of this.cos){
      if(co.rel>0){co.rel--;continue;}
      if(co.home>0){co.home--;continue;}
      const steps=p.rush>0?(frame%2):1+(((G.level>=4&&frame%2===0)||(G.level>=3&&frame%4===0))?1:0);
      for(let s=0;s<steps;s++){if(this.center(co))this.steer(co);co.x+=co.dir[0];co.y+=co.dir[1];}
      if(Math.abs(co.x-p.x)<10&&Math.abs(co.y-p.y)<10){
        if(p.rush>0){this.sendHome(co,180);addScore(200);SFX.zap();pop(p.x,p.y+2,'BACK TO WORK!','#6fb7ff');}
        else if(p.freeze===0){p.freeze=100;SFX.trap();pop(p.x,p.y+2,co.stapler?'CHOMP!':pick(ASKS),'#ff7eb6');G.shake=6;
          if(this.got>0){this.got--;this.placePud(4);}
          this.sendHome(co,120);}
      }
    }
    if(this.got>=this.need&&this.center(p)&&(p.x-8)/16===this.D.c&&(p.y-8)/16===this.D.r){
      this.won=1;this.bonus=Math.ceil(this.time/60)*20;addScore(1000+this.bonus);SFX.goal();pop(p.x,p.y,'MADE IT!');}
  },
  draw(){
    const OY=16,ready=this.got>=this.need;
    for(let r=0;r<14;r++)for(let c=0;c<16;c++){const x=c*16,y=r*16+OY;
      if(this.map[r][c]==='#'){
        const edge=r===0||r===13||c===0||c===15;
        ctx.fillStyle=edge?'#2d2840':'#4a4560';ctx.fillRect(x,y,16,16);
        ctx.fillStyle=edge?'#3a3452':'#6e6888';ctx.fillRect(x,y,16,4);
        if(!edge){const k=(c*7+r*13)%9;
          if(k===1){ctx.fillStyle='#e6e6ee';ctx.fillRect(x+2,y+1,12,14);ctx.fillStyle='#8a8aa0';ctx.fillRect(x+2,y+7,12,1);ctx.fillRect(x+11,y+3,1,3);}
          else if(k===2){ctx.fillStyle='#0d0b14';ctx.fillRect(x+3,y+6,4,4);ctx.fillRect(x+9,y+6,4,4);ctx.fillStyle='#e8433a';ctx.fillRect(x+4,y+7,2,2);}
          else if(k===3){ctx.fillStyle='#6fb7ff';ctx.fillRect(x+3,y+6,10,6);ctx.fillStyle='#c9c4b5';ctx.fillRect(x+7,y+3,2,4);}
          else if(k===5)spr(COFFEE,x+4,y+6);}
      }else{
        ctx.fillStyle=(r+c)%2?'#2a2440':'#231e36';ctx.fillRect(x,y,16,16);
      }}
    // desk
    {const x=this.D.c*16,y=this.D.r*16+OY;
      if(ready&&(frame>>3)%2){ctx.fillStyle='#ffd23f';ctx.fillRect(x-1,y-1,18,18);}
      ctx.fillStyle='#7a4a24';ctx.fillRect(x+1,y+8,14,7);ctx.fillStyle='#c9c4b5';ctx.fillRect(x+4,y+1,8,7);ctx.fillStyle='#1b3a6b';ctx.fillRect(x+5,y+2,6,5);
      if(ready)txt('DESK',x+8+12,y-10,'#ffd23f',8,'center');}
    {const x=this.B.c*16,y=this.B.r*16+OY;ctx.fillStyle='#3d2a1a';ctx.fillRect(x+1,y+1,14,14);ctx.fillStyle='#f08a24';ctx.fillRect(x+3,y+3,10,2);ctx.fillRect(x+3,y+11,10,2);}
    for(const q of this.puds)spr(PUD,q.c*16+4,q.r*16+OY+4+Math.round(Math.sin(frame/10+q.b)));
    for(const co of this.cos){if(co.rel>0&&(frame>>3)%2)continue;
      if(co.stapler){drawStapler(co.x,co.y+OY,1);continue;}
      const scared=this.p.rush>0;
      const pal=scared?(((frame>>3)%2||this.p.rush>60)?{B:'#2f6fd6',S:'#c8e0ff',H:'#1b3a6b'}:{B:'#f4f4f4'}):co.pal;
      if(G.level>=3&&!scared){ctx.fillStyle=(frame>>2)%2?'rgba(155,89,208,.45)':'rgba(255,126,182,.35)';ctx.fillRect(co.x-8,co.y+OY-10,16,18);}
      spr((frame>>3)%2?GUY:GUY2,co.x-4,co.y+OY-7,{pal:G.level>=3&&!scared?MASTERPAL:pal,flip:co.dir[0]<0});
      if(!scared&&!co.home){const by=co.y+OY-17+Math.round(Math.sin(frame/8));ctx.fillStyle='#f4f4f4';ctx.fillRect(co.x-4,by,9,9);ctx.fillRect(co.x-2,by+9,2,2);txt('?',co.x+1,by+1,'#e8433a',8,'center',null);}
    }
    const p=this.p;
    if(!(p.freeze&&(frame>>2)%2))drawHero(p.x-4,p.y+OY-7,{head:10,h:12,flip:p.face<0,walk:p.anim>>2&1,pal:p.rush>0&&(frame>>2)%2?RUSH:undefined});
    if(p.freeze){ctx.fillStyle='#f4f4f4';for(let i=0;i<3;i++)ctx.fillRect(p.x-6+i*5,p.y+OY-14,2,2);}
    hud('PUD '+this.got+'/'+this.need);
    const sec=Math.ceil(this.time/60);
    txt('T'+sec,206,4,sec<=15&&(frame>>3)%2?'#e8433a':'#f4f4f4',8,'right');
  }
};

const BRIEF_LANG=[['BRIEF','ENGLISH'],['BREF','FRENCH'],['KURZ','GERMAN'],['SUNTO','ITALIAN'],['FEIRB','BACKWARDS'],['BREVE','SPANISH']];
// the red stapler: shows up late in the week and chases you
function drawStapler(x,y,s=1){

    }
    for(const q of this.parts){ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,3,3);}
    for(const u of this.bul){const x=Math.round(u.x),y=Math.round(u.y);
      ctx.fillStyle='#f4f4f4';ctx.fillRect(x-4,y-3,8,6);
      if(u.k==='t'){ctx.fillStyle='#e8433a';ctx.fillRect(x-3,y-1,6,1);ctx.fillRect(x-3,y+1,4,1);}
      else{ctx.fillStyle='#8a8aa0';ctx.fillRect(x-4,y-3,1,1);ctx.fillRect(x-3,y-2,2,1);ctx.fillRect(x-1,y-1,2,1);ctx.fillRect(x+1,y-2,2,1);ctx.fillRect(x+3,y-3,1,1);}}
    for(const s of this.shots)spr(DONUT,s.x-4,s.y-4,{flip:(frame>>2)%2===1});
    if(!(p.inv&&(frame>>2)%2))drawHero(p.x,p.y,{s:2,head:16,h:24,flip:p.f<0,walk:p.anim>>3&1});
    // HUD
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,26);
    txt('SC '+pad6(G.score),4,4,'#fff');txt('FRIDAY',150,4,'#ffd23f',8,'center');
    for(let i=0;i<G.lives;i++)drawImg(HEADS[8],W-11-i*10,3);
    txt('BOSS',44,16,'#e8433a',8,'right',null);
    ctx.fillStyle='#2a2440';ctx.fillRect(48,17,160,6);ctx.fillStyle=ph===3?'#ff7eb6':'#e8433a';ctx.fillRect(48,17,160*Math.max(0,b.hp)/b.max,6);
    for(let i=0;i<p.hp;i++)spr(HEART,6+i*9,226);
    if(b.mode==='intro')txt('THE FRIDAY BOSS',128,150,'#e8433a',16,'center','#0d0b14');
    if(this.over)txt('TGIF!!',128,90,'#ffd23f',32,'center','#e8433a');
  }
};
const Ending={
  init(){this.t=0;SFX.oneup();},
  update(){this.t++;if(this.t>90&&(pressed.start||pressed.a))go(Title);},
  draw(){
    ctx.fillStyle='#05040a';ctx.fillRect(0,0,W,H);
    for(let k=0;k<4;k++){const ph=(this.t+k*37)%120,cx=40+((k*73)%180),cy=50+((k*41)%60),c=['#ffd23f','#ff7eb6','#6fb7ff','#5bc248'][k];
      if(ph<60)for(let i=0;i<14;i++){const a=i/14*6.283,r=ph*.9;ctx.fillStyle=c;ctx.fillRect(cx+Math.cos(a)*r,cy+Math.sin(a)*r+ph*ph*.004,2,2);}}
    txt('TGIF!',128,16,'#ffd23f',32,'center','#e8433a');
    if(heroReady())ctx.drawImage(HERO,104,58+Math.round(Math.sin(this.t/12)*3),48,65);
    txt('YOU SURVIVED THE WEEK',128,134,'#f4f4f4',8,'center');
    txt('FINAL SCORE',128,156,'#8f89a8',8,'center');
    txt(pad6(G.score),128,170,'#ffd23f',16,'center');
    txt('SEE YOU MONDAY...',128,196,'#8f89a8',8,'center',null);
    if(this.t>90&&(this.t>>4)%2)txt('PRESS START',128,216,'#ffd23f',8,'center');
  }
};

/* trippy post-processing: wavy rows + colour cycling. Gets stronger later in the week */
const fxCv=document.createElement('canvas');fxCv.width=W;fxCv.height=H;
function weird(){
  if(![Run,Brawl,Kitchen,DriveHome,Boss].includes(scene))return 0;
  const lv=G.level;return lv>=5?(Boss.ph===3?.8:.4):lv>=4?.6:lv>=3?.3:lv>=2&&scene===Run?.15:0;
}
function moodScene(){return[Intro,Run,Brawl,Kitchen,DriveHome,Boss].includes(scene);}
function postFX(){
  const k=weird(),trip=G.trip>0,m=moodScene()?G.mood:0;
  if(k>0||trip){
    const amp=trip?Math.min(7,2+G.trip/30):2*k;
    const fc=fxCv.getContext('2d');fc.clearRect(0,0,W,H);fc.drawImage(cv,0,0);
    for(let y=0;y<H;y+=2){const off=Math.round(Math.sin(y/14+frame/9)*amp);if(off)ctx.drawImage(fxCv,0,y,W,2,off,y,W,2);}
    if(trip&&(frame>>3)%5===0){fc.clearRect(0,0,W,H);fc.drawImage(cv,0,0,W/4,H/4);ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(fxCv,0,0,W/4,H/4,0,0,W,H);ctx.restore();}
  }
  // mood: doing well turns the world pink and sparkly, doing badly drains it dark
  if(m>.5){const q=(m-.5)*2;
    ctx.fillStyle='rgba(255,126,182,'+(q*.12).toFixed(3)+')';ctx.fillRect(0,0,W,H);
    const n=Math.round(q*16);
    for(let i=0;i<n;i++){const x=(i*97+frame*(1+i%3))%W,y=(i*53+frame*(1+i%2)*.7)%H,c=i%2?'#ff7eb6':'#ffd23f';
      ctx.fillStyle=c;ctx.fillRect(x,y,2,2);if((frame+i*7)%20<10){ctx.fillRect(x-2,y,1,2);ctx.fillRect(x+3,y,1,2);ctx.fillRect(x,y-2,2,1);ctx.fillRect(x,y+3,2,1);}}
  }
  let f='';
  if(k>0||trip)f+='hue-rotate('+(Math.round(trip?frame*7:frame*k*1.5)%360)+'deg) ';
  if(trip)f+='saturate(1.8)';
  else if(m>.5)f+='saturate('+(1+(m-.5)*1.4).toFixed(2)+')';
  f=f.trim();if(cv.style.filter!==f)cv.style.filter=f;
}

/* ---------- dev menu: open with #dev on the link, or on the title press up up down down left right left right B A ---------- */
const STAGES=[['INTRO',()=>go(Intro)],['CUBICLE RUN',()=>go(Run)],['OBJECTIVE MAYHEM',()=>go(Brawl)],['PUDDING RUN',()=>go(Kitchen)],['DRIVE HOME',()=>go(DriveHome)],['FRIDAY BOSS',()=>go(Boss)],['ENDING',()=>go(Ending)]];
const Dev={
  sel:0,day:1,
  init(){G.dev=true;if(G.lives<1)G.lives=3;},
  rows(){return[...STAGES.map(s=>s[0]),'INVINCIBLE: '+(G.god?'ON':'OFF'),'LIVES: '+G.lives,'TRIP MODE: '+(G.alwaysTrip?'ON':'OFF'),'BACK TO TITLE'];},
  update(){
    const n=this.rows().length,S=STAGES.length;
    if(pressed.up)this.sel=(this.sel+n-1)%n;
    if(pressed.down)this.sel=(this.sel+1)%n;
    if(pressed.left||pressed.right){const d=pressed.right?1:-1;
      if(this.sel<S)this.day=clamp(this.day+d,1,5);
      else if(this.sel===S+1)G.lives=clamp(G.lives+d,1,9);}
    if(pressed.a||pressed.start||pressed.b){const i=this.sel;
      if(i<S){G.level=STAGES[i][0]==='FRIDAY BOSS'?5:this.day;STAGES[i][1]();}
      else if(i===S)G.god=!G.god;
      else if(i===S+1)G.lives=G.lives%9+1;
      else if(i===S+2)G.alwaysTrip=!G.alwaysTrip;
      else go(Title);
      SFX.spawn();}
  },
  draw(){
    ctx.fillStyle='#05040a';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff7eb6';for(let x=0;x<W;x+=8)ctx.fillRect(x,0,4,3);
    txt('DEV MENU',128,12,'#ffd23f',16,'center','#e8433a');
    txt('DAY  < '+this.day+' '+DAYS[this.day-1]+' >',128,40,'#6fb7ff',8,'center');
    this.rows().forEach((r,i)=>{const y=62+i*14+(i>=STAGES.length?8:0),on=i===this.sel;
      if(on){ctx.fillStyle='#2a2440';ctx.fillRect(20,y-3,216,13);}
      txt((on?'> ':'  ')+r,28,y,on?'#ffd23f':'#f4f4f4',8,'left',null);});
    txt('UP/DN PICK  A=GO  </> CHANGE',128,222,'#8f89a8',8,'center',null);
  }
};

/* ---------- loop ---------- */
function step(){
  if(pressed.pause){paused=!paused;}
  if(paused){if(pressed.start||pressed.a)paused=false;for(const k in pressed)pressed[k]=false;return;}
  scene.update();
  if(scene===Brawl)MUS.shift=Brawl.gd<0?5:0;
  let ms=1;
  if(scene===Kitchen)ms=Kitchen.p&&Kitchen.p.rush>0?1.3:1;
  if(scene===Boss)ms=Boss.ph===3?1.12:1;
  if(scene===DriveHome)ms=1+DriveHome.sp/25;
  MUS.speed=ms*(1+(moodScene()?G.mood:0)*.1);
  G.mood*=.9992;
  if(G.trip>0)G.trip--;
  if(G.alwaysTrip)G.trip=Math.max(G.trip,30);
  musicTick();
  pops.forEach(p=>{p.y-=.5;p.t--;});pops=pops.filter(p=>p.t>0);
  if(G.shake>0)G.shake--;
  for(const k in pressed)pressed[k]=false;
  frame++;
}
function render(){
  ctx.save();
  if(G.shake>0)ctx.translate(Math.round(rnd(-2,2)),Math.round(rnd(-2,2)));
  scene.draw();
  for(const p of pops)txt(p.s,p.x,p.y,p.col,8,'center');
  ctx.restore();ctx.save();postFX();
  ctx.restore();
  if(G.dev&&scene!==Dev)txt(G.god?'DEV GOD':'DEV',252,232,'#ff7eb6',8,'right',null);
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('PAUSED',128,104,'#ffd23f',16,'center');txt('PRESS START',128,132,'#f4f4f4',8,'center');}
}
let last=0,acc=0;const DT=1000/60;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;
  while(acc>=DT){step();acc-=DT;}
  render();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene!==Title)paused=true;});
Title.music='title';Run.music='run';Brawl.music='brawl';Kitchen.music='kitchen';Boss.music='boss';DriveHome.music='run';Ending.music='title';
window.__cpm={step,go,keys,pressed,G,scenes:{Title,Intro,Run,Brawl,Kitchen,DriveHome,Banner,Boss,Ending,Dev},get scene(){return scene}};
if(location.hash==='#dev')go(Dev);else go(Title);
requestAnimationFrame(loop);
})();
</script>
